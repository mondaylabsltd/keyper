<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Frames a raw app screenshot with a caption for the store listings. Rendered by
     store/render.mjs; the query string carries the image, the caption and the size. -->
<style>
  html, body { margin: 0; }
  body { overflow: hidden; background: #fbf8f3; color: #211b14;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans CJK SC', sans-serif; }
  .page { box-sizing: border-box; height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 6vh 0 5vh; background: radial-gradient(circle at 85% 8%, #fbefd6 0, rgba(251,239,214,0) 50%); }
  h1 { margin: 0 7vw; font-size: 6.4vw; line-height: 1.15; letter-spacing: -0.02em; text-align: center; text-wrap: balance; }
  p { margin: 1.4vh 8vw 0; font-size: 3.6vw; line-height: 1.35; color: #6b6153; text-align: center; }
  .shot { margin-top: 4.5vh; flex: 1 1 auto; min-height: 0; border-radius: 3.2vh; overflow: hidden;
    box-shadow: 0 0.4vh 1vh rgba(60,40,0,.08), 0 3vh 7vh rgba(60,40,0,.16); border: 0.25vh solid #e9e0d1; }
  .shot img { height: 100%; display: block; }
</style>
</head>
<body>
<div class="page">
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div class="shot"><img id="img" alt=""></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').textContent = q.get('title');
  document.getElementById('sub').textContent = q.get('sub');
  document.getElementById('img').src = q.get('img');
  document.documentElement.lang = q.get('lang') || 'en';
</script>
</body>
</html>
