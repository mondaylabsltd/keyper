<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Source of the Google Play feature graphic (1024×500). Render: see store/README.md. -->
<style>
  html, body { margin: 0; }
  body { width: 1024px; height: 500px; overflow: hidden; background: #fbf8f3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans CJK SC', sans-serif; color: #211b14; }
  .wrap { display: flex; align-items: center; gap: 56px; height: 100%; padding: 0 80px; box-sizing: border-box;
    background: radial-gradient(circle at 88% 20%, #fbefd6 0, rgba(251,239,214,0) 55%); }
  svg { flex: none; filter: drop-shadow(0 18px 36px rgba(160, 90, 0, .25)); }
  h1 { margin: 0; font-size: 54px; line-height: 1.05; letter-spacing: -0.02em; }
  p { margin: 18px 0 0; font-size: 28px; line-height: 1.35; color: #6b6153; max-width: 560px; }
  .chips { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; }
  .chips span { font-size: 19px; padding: 7px 14px; border-radius: 999px; background: #fff; border: 1px solid #e9e0d1; color: #6b6153; }
</style>
</head>
<body>
<div class="wrap">
  <svg width="220" height="220" viewBox="18 18 72 72">
    <defs><linearGradient id="g" x1="18" y1="18" x2="90" y2="90" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffd45c"/><stop offset="1" stop-color="#f39200"/></linearGradient></defs>
    <rect x="18" y="18" width="72" height="72" rx="17" fill="url(#g)"/>
    <g fill="#a35a00" fill-opacity="0.2" transform="translate(0 2.5)"><path fill-rule="evenodd" d="M23,54a15,15 0 1 0 30 0a15,15 0 1 0 -30 0zM32,54a6,6 0 1 0 12 0a6,6 0 1 0 -12 0z"/><path d="M50,50h30a4,4 0 0 1 0 8h-30zM66,57h6v7a2,2 0 0 1 -2 2h-2a2,2 0 0 1 -2 -2zM75,57h5v5a2,2 0 0 1 -2 2h-1a2,2 0 0 1 -2 -2z"/></g>
    <g fill="#fff"><path fill-rule="evenodd" d="M23,54a15,15 0 1 0 30 0a15,15 0 1 0 -30 0zM32,54a6,6 0 1 0 12 0a6,6 0 1 0 -12 0z"/><path d="M50,50h30a4,4 0 0 1 0 8h-30zM66,57h6v7a2,2 0 0 1 -2 2h-2a2,2 0 0 1 -2 -2zM75,57h5v5a2,2 0 0 1 -2 2h-1a2,2 0 0 1 -2 -2z"/></g>
  </svg>
  <div>
    <h1 id="title"></h1>
    <p id="lead"></p>
    <div class="chips" id="chips"></div>
  </div>
</div>
<script>
  const text = {
    en: { title: 'A recovery phrase you keep in your head', lead: 'Your email and a sentence only you know give the same BIP39 phrase, every time.', chips: ['Offline only', 'No permissions', 'Open source'] },
    zh: { title: '记在脑子里的助记词', lead: '你的邮箱加一句只有你知道的话，每次都得到同一组 BIP39 助记词。', chips: ['只在离线时工作', '零权限', '开源'] }
  }[location.hash.slice(1) || 'en'];
  document.getElementById('title').textContent = text.title;
  document.getElementById('lead').textContent = text.lead;
  for (const c of text.chips) { const s = document.createElement('span'); s.textContent = c; document.getElementById('chips').append(s); }
</script>
</body>
</html>
