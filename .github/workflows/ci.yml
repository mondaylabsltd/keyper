name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4 # also validates the Gradle wrapper
      - name: Test, lint and build
        working-directory: app-android
        # :core:test runs SPEC's vectors with the full 1 GiB Argon2id.
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app-android/*/build/reports/

  ios:
    name: iOS core and app tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Core tests, including SPEC's 1 GiB vectors
        working-directory: app-ios/KeyperCore
        run: swift test -c release
      - name: App unit tests on a simulator
        working-directory: app-ios
        run: |
          simulator=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild -project Keyper.xcodeproj -scheme Keyper -destination "platform=iOS Simulator,id=$simulator" \
            -only-testing:KeyperTests CODE_SIGNING_ALLOWED=NO test

  reference:
    name: Python reference self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/requirements.txt
      - run: pip install -r reference/requirements.txt
      - run: python reference/keyper.py --self-test
